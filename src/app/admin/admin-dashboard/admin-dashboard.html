<div class="container-fluid">
    <div class="row">
        @if (isSidebarOpen) {
            <div class="col-lg-2">
            <app-admin-sidebar></app-admin-sidebar>
        </div>
        }
        <div class="col">
            <!-- header -->
             <div class="row">
                <div class="p-3 bg-success w-100 d-flex align-items-center justify-content-between">
                    <div class="fs-3 text-light">
                        <button (click)="toggleSidebar()" class="btn text-light"><i class="fa-solid fa-bars fa-2x"></i></button>
                        ADMIN
                    </div>
                    <!-- log out dropdown -->
                    <div class="dropdown">
  <a class="btn text-light dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
    <i class="fa-solid fa-user text-light"></i>
  </a>

  <ul class="dropdown-menu">
    <li><button (click)="logout()" class="dropdown-item">Logout <i class="fa-solid fa-arrow-right-from-bracket"></i></button></li>
  </ul>
</div>
                </div>
             </div>
             <div class="row my-5">
                <!-- box -->
                 <div class="col-lg-3">
                    <div style="background-color: rgba(255, 215 ,0, 0.8);" class="d-flex justify-content-center align-items-center p-2 rounded text-light">
                        <i class="fa-solid fa-users fs-1"></i>
                        <div class="ms-5">
                            <h4>Users</h4>
                            <h3>{{userCount()}}</h3>
                        </div>
                    </div>
                 </div>
                 <div class="col-lg-3">
                    <div style="background-color: rgba(131, 224, 44, 0.8);" class="d-flex justify-content-center align-items-center p-2 rounded text-light">
                        <i class="fa-solid fa-bowl-rice fs-1"></i>
                        <div class="ms-5">
                            <h4>Recipes</h4>
                            <h3>{{recipeCount()}}</h3>
                        </div>
                    </div>
                 </div>
                 <div class="col-lg-3">
                    <div style="background-color: rgba(111, 233, 244, 0.8);" class="d-flex justify-content-center align-items-center p-2 rounded text-light">
                        <i class="fa-solid fa-download fs-1"></i>
                        <div class="ms-5">
                            <h4>Downloads</h4>
                            <h3>{{downloadCount()}}</h3>
                        </div>
                    </div>
                 </div>
                 <div class="col-lg-3">
                    <div style="background-color: rgba(206, 75, 206, 0.8);" class="d-flex justify-content-center align-items-center p-2 rounded text-light">
                        <i class="fa-solid fa-message fs-1"></i>
                        <div class="ms-4">
                            <h4>Notification</h4>
                            <h6>You have <a routerLink="/admin/feedbacks"> {{getNotificationCount()}} </a>new feedbacks</h6>
                        </div>
                    </div>
                 </div>

             </div>
        </div>
    </div>
</div>
