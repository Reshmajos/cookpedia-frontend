<div class="container-fluid">
    <div class="row">
        @if (isSidebarOpen) {
            <div class="col-lg-2">
            <app-admin-sidebar></app-admin-sidebar>
        </div>
        }
        <div class="col">
            <!-- header -->
             <div class="row">
                <div class="p-3 bg-success w-100 d-flex align-items-center justify-content-between">
                    <div class="fs-3 text-light">
                        <button (click)="toggleSidebar()" class="btn text-light"><i class="fa-solid fa-bars fa-2x"></i></button>
                        ADMIN
                    </div>
                    <!-- log out dropdown -->
                    <div class="dropdown">
  <a class="btn text-light dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
    <i class="fa-solid fa-user text-light"></i>
  </a>

  <ul class="dropdown-menu">
    <li><button (click)="logout()" class="dropdown-item">Logout <i class="fa-solid fa-arrow-right-from-bracket"></i></button></li>
  </ul>
</div>
                </div>
             </div>
        </div>
    </div>
</div>
