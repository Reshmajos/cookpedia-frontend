<div class="container-fluid">
    <div class="row">
        <div class="col-lg-2">
            <app-admin-sidebar></app-admin-sidebar>
        </div>
        <div class="col">
            <h1 class="mb-5">All Feedback List</h1>
            <table class="table table-stripped table-hover">
                <thead>
                    <tr class="table-success">
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Message</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    @for (list of allFeedbacks(); track $index; let i = $index) {
                   <tr>
                    <td>{{i+1}}</td>
                    <td>{{list.name}}</td>
                    <td>{{list.email}}</td>
                    <td>{{list.message}}</td>
                    <td>
                        @if (list.status=="pending") {
                            <div class="d-flex">
                                <button (click)="updateFeedback(list._id,'approve')" class="btn btn-success"><i class="fa-solid fa-check"></i></button>
                                <button (click)="updateFeedback(list._id,'reject')" class="btn btn-danger ms-2"><i class="fa-solid fa-x"></i></button>
                            </div>
                        }@else if (list.status=="approve") {
                            <button class="btn btn-success">APPROVE</button>
                        }@else {
                            <button class="btn btn-danger">REJECT</button>
                        }
                    </td>
                   </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
